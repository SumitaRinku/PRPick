<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>赛事回看 - PRG 竞猜</title>
    <link rel="icon" type="image/png" href="/images/prpicklogo_square.png">
    <link rel="apple-touch-icon" href="/images/prpicklogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/hub.css">
    <link rel="stylesheet" href="/css/bracket.css">
    <link rel="stylesheet" href="/css/polish.css">
    <link rel="stylesheet" href="/css/game-stats.css">
    <link rel="stylesheet" href="/css/review.css">
    <link rel="stylesheet" href="/css/pickem.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRPICK 首页"><img src="/images/prpicklogo-light.png" alt="PRPICK" width="1211" height="250"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a class="active" href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <h1>赛事回看</h1>
        </section>
    </header>

    <main class="page-shell rv-page">
        <section class="rv-toolbar" aria-label="赛事筛选">
            <div class="rv-toolbar-row">
                <div id="gameSeg" class="rv-seg" role="group" aria-label="游戏" data-game-switch></div>
                <div id="statusSeg" class="rv-seg" role="group" aria-label="状态">
                    <button type="button" data-status="">全部</button>
                    <button type="button" data-status="ongoing">进行中</button>
                    <button type="button" data-status="finished">已结束</button>
                </div>
                <label class="rv-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.45l4.25 4.25 1.4-1.4-4.25-4.25A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z" fill="currentColor"/></svg>
                    <input id="tournamentSearch" type="search" placeholder="搜索赛事" aria-label="搜索赛事" autocomplete="off">
                </label>
            </div>
            <div class="rv-toolbar-row rv-toolbar-chips">
                <div id="brandFilters" class="rv-chips" aria-label="厂牌"></div>
                <div id="tierSeg" class="rv-chips rv-tier" aria-label="级别"></div>
            </div>
        </section>
        <section id="pickemOpen" class="rv-pk-open-list" aria-label="开放中的 Pick'em" hidden></section>
        <section id="previewSection" class="rv-upcoming" aria-label="赛事预告" hidden>
            <h2 class="rv-group-title">赛事预告<span id="previewMeta"></span></h2>
            <div id="previewList" class="rv-upcoming-list"></div>
        </section>
        <section id="tournaments" class="rv-list"></section>
    </main>

    <div id="detailModal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeDetailModal()"></div>
        <section class="modal-panel">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            <div id="detailModalBody"></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/games.js"></script>
    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/h2h.js"></script>
    <script src="/js/match-center.js"></script>
    <script src="/js/game-stats.js"></script>
    <script src="/js/bracket-graph.js"></script>
    <script src="/js/bracket.js"></script>
    <script src="/js/bracket-ui.js"></script>
    <script src="/js/tournament-order.js"></script>
    <script src="/js/pickem.js"></script>
    <script src="/js/tournaments.js"></script>
</body>
</html>
